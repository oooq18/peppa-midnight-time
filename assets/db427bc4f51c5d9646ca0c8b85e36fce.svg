"0" font-family="&quot;ヒラギノ角ゴ Pro W3&quot;, &quot;Hiragino Kaku Gothic Pro&quot;, Osaka, &quot;メイリオ&quot;, Meiryo, &quot;ＭＳ Ｐゴシック&quot;, &quot;MS PGothic&quot;" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">六点过后不就，你就听</tspan><tspan x="0" dy="46.150000000000006px">到了汽车鸣笛的声音，</tspan><tspan x="0" dy="46.150000000000006px">猪爸爸和猪妈妈带着</tspan><tspan x="0" dy="46.150000000000006px">泥坑大师回来了。泥坑</tspan><tspan x="0" dy="46.150000000000006px">大师运用他那快要失传</tspan><tspan x="0" dy="46.150000000000006px">的泥坑大法治好了佩奇</tspan><tspan x="0" dy="46.150000000000006px">和乔治的狂热泥坑想和</tspan><tspan x="0" dy="46.150000000000006px">别人一起跳症，干得不</tspan><tspan x="0" dy="46.150000000000006px">错！猪爸爸和猪妈妈给</tspan><tspan x="0" dy="46.150000000000006px">了你双份工资！</tspan></text><path d="M330.50001,114.24999l2,170l-192,1l1.5,-171.5" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/><path d="M312.00001,97.24999l-153,-1.5" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/><text transform="translate(211.49999,300.27858) scale(0.2375,0.2375)" font-size="40" xml:space="preserve" fill="#ff0000" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="&quot;ヒラギノ角ゴ Pro W3&quot;, &quot;Hiragino Kaku Gothic Pro&quot;, Osaka, &quot;メイリオ&quot;, Meiryo, &quot;ＭＳ Ｐゴシック&quot;, &quot;MS PGothic&quot;" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">点击纸张继续</tspan></text><text transform="translate(215.49999,77.24999) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#000000" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="&quot;ヒラギノ角ゴ Pro W3&quot;, &quot;Hiragino Kaku Gothic Pro&quot;, Osaka, &quot;メイリオ&quot;, Meiryo, &quot;ＭＳ Ｐゴシック&quot;, &quot;MS PGo